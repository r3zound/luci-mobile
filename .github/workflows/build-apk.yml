name: build-apk

# Builds the Android APK on GitHub's runners, which ship a complete Android
# SDK and NDK. That matters here: a local build on this machine stalled on
# `sdkmanager` failing to extract `android-ndk-r28c` (AGP resolves the NDK at
# *configuration* time, because android/app/build.gradle.kts pins
# ndkVersion = "28.2.13676358", so nothing builds until it is present).
#
# debug and release are separate jobs on purpose. The first attempt at this
# workflow had them in one job, and a keystore step that failed after a
# successful debug build meant the run produced no artifact at all. Now a
# release problem cannot cost you the debug APK.
#
#   debug   - the one to install for verifying changes on a device
#   release - minified + shrunk, signed with a THROWAWAY key generated here
#
# The release key does not exist anywhere else and is not backed up. The APK is
# fine for sideloading, but every new run generates a different key, so an APK
# from one run cannot upgrade an APK from another. Set KEYSTORE_B64 /
# KEYSTORE_PASSWORD / KEYSTORE_ALIAS / KEYSTORE_KEY_PASSWORD as repository
# secrets to sign with something stable instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  debug:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the exact toolchain the changes were validated against:
      # Dart 3.13.5. pubspec.yaml asks for sdk ^3.8.1, so anything from 3.32.5
      # up satisfies it, but only 3.47.7 has actually been run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Toolchain banner
        run: |
          flutter --version
          java -version
          echo "keytool: $(command -v keytool || echo MISSING)"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub lib

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect debug APK
        run: |
          mkdir -p dist/debug
          cp -v build/app/outputs/flutter-apk/app-debug.apk dist/debug/
          sha256sum dist/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: luci-mobile-debug-apk
          path: dist/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate throwaway release keystore
        run: |
          # A new PKCS12 store rejects a password shorter than 6 characters -
          # `-storepass ci` fails here with "keystore password was too short".
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storetype PKCS12 \
            -storepass 'changeit' -keypass 'changeit' -alias 'ci' \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Throwaway, OU=Fork Build, O=r3zound, C=US"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass 'changeit' -alias 'ci'

      - name: Write signing config
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}"
              echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}"
            } > android/key.properties
            echo "signing with the repository secret keystore"
          else
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=changeit"
              echo "keyAlias=ci"
              echo "keyPassword=changeit"
            } > android/key.properties
            echo "signing with a THROWAWAY key generated for this run only"
          fi
          cat android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect release APK
        run: |
          mkdir -p dist/release
          cp -v build/app/outputs/flutter-apk/app-release.apk dist/release/
          sha256sum dist/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: luci-mobile-release-apk
          path: dist/release/*.apk
          if-no-files-found: error
          retention-days: 30
